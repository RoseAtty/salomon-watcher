name: TheOdderSide – koszula flanelowa S

on:
  schedule:
    - cron: "*/10 * * * *"   # co 10 minut (GitHub potrafi opóźnić start o kilka minut)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego testu

permissions:
  actions: write              # żeby workflow mógł się sam wyłączyć po znalezieniu
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź dostępność rozmiaru S
        id: watch
        run: python3 theodderside_watcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMSAPI_TOKEN: ${{ secrets.SMSAPI_TOKEN }}
          SMS_TO: ${{ secrets.SMS_TO }}

      - name: Wyłącz monitor po wysłaniu powiadomienia
        if: steps.watch.outputs.available == 'true'
        run: gh workflow disable theodderside.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
